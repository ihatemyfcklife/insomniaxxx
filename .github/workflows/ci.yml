name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Verify pinned modules
        run: |
          go mod download
          go mod verify

      - name: Check Go formatting
        run: |
          files="$(git diff --name-only origin/main...HEAD -- '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(printf '%s\n' "$files" | xargs gofmt -l)"
            if [ -n "$unformatted" ]; then
              echo "These changed Go files need gofmt:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Check frontend JavaScript syntax
        run: |
          node --check internal/app/static/boot.js
          node --check internal/app/static/view.js
          node --check tests/frontend.test.cjs
          node tests/frontend.test.cjs

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build WebAssembly frontend
        run: |
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/app/static/wasm_exec.js
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o internal/app/static/app.wasm ./cmd/wasm
          test -s internal/app/static/app.wasm

      - name: Build Linux server binary
        env:
          VERSION: ${{ github.sha }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w -X anonblossom/internal/web.Version=$VERSION" -o dist/anonblossom ./cmd/anonblossom
          test -s dist/anonblossom

      - name: Build production container
        run: docker build --build-arg VERSION="${GITHUB_SHA}" --tag anonblossom:ci .
