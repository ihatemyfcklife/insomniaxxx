name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Verify pinned modules
        run: |
          go mod download
          go mod verify

      - name: Check Go formatting
        run: |
          files="$(git diff --name-only origin/main...HEAD -- '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(printf '%s\n' "$files" | xargs gofmt -l)"
            if [ -n "$unformatted" ]; then
              echo "These changed Go files need gofmt:"
              echo "$unformatted"
              printf '%s\n' "$files" | xargs gofmt -d
              exit 1
            fi
          fi

      - name: Check frontend JavaScript syntax
        run: |
          node --check internal/app/static/boot.js
          node --check internal/app/static/view.js
          node --check internal/app/static/direct-blossom.js
          node --check internal/app/static/stream-file.js
          node --check tests/stream-file.test.cjs
          node --check tests/direct-blossom.test.cjs
          node --check tests/direct-batch.test.cjs
          node --check tests/frontend.test.cjs
          node --check tests/load/cipher-download.mjs
          node --check tests/load/mixed-transfers.mjs
          node --check internal/app/static/zk-fragment.js
          node --check tests/zk-fragment.test.cjs
          node tests/zk-fragment.test.cjs
          node tests/frontend.test.cjs
          node tests/direct-blossom.test.cjs
          node tests/direct-batch.test.cjs
          node tests/stream-file.test.cjs
          node tests/load-integrity.test.cjs

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build WebAssembly frontend
        run: |
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/app/static/wasm_exec.js
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o internal/app/static/app.wasm ./cmd/wasm
          test -s internal/app/static/app.wasm
          node tests/wasm-auth-smoke.cjs

      - name: Build Linux server binary
        env:
          VERSION: ${{ github.sha }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w -X anonblossom/internal/web.Version=$VERSION" -o dist/anonblossom ./cmd/anonblossom
          test -s dist/anonblossom

      - name: Verify container Go security patch level
        run: |
          docker build --target build --tag anonblossom:builder .
          builder_version="$(docker run --rm --entrypoint go anonblossom:builder version)"
          echo "$builder_version"
          case "$builder_version" in
            *"go1.27.2 "*) ;;
            *) echo "::error::Expected Go 1.27.2 patched runtime in Docker builder"; exit 1 ;;
          esac

      - name: Build production container
        run: docker build --build-arg VERSION="${GITHUB_SHA}" --tag anonblossom:ci .

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout into path with spaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source with spaces
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: source with spaces/go.sum
      - name: Build using Windows Make recipes
        working-directory: source with spaces
        run: |
          if (!(Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Make installation failed' }
          }
          make deps
          if ($LASTEXITCODE -ne 0) { throw 'make deps failed' }
          make build
          if ($LASTEXITCODE -ne 0) { throw 'make build failed' }
          if (!(Test-Path bin/anonblossom.exe)) { throw 'Missing Windows executable' }
          node tests/wasm-auth-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'WASM smoke failed' }
      - name: Check make run and dotenv on localhost
        working-directory: source with spaces
        run: |
          @'
          # This file is loaded by the run helper, not the runner's shell.
          APP_ENV=development
          LISTEN_ADDR='127.0.0.1:18080'
          PUBLIC_BASE_URL="http://localhost:18080"
          ONIONGUARD_COOKIE_SECURE=false
          '@ | Set-Content .env -Encoding UTF8
          $process = Start-Process cmd.exe -ArgumentList '/d /c make run' -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) { throw 'make run exited before startup' }
              try {
                $response = Invoke-WebRequest http://localhost:18080/static/pico.min.css -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.RawContentLength -gt 0) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw 'Server did not start with dotenv settings' }
          } finally {
            if (!$process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }
            Get-Content server.log, server.err -ErrorAction SilentlyContinue
            Remove-Item .env -ErrorAction SilentlyContinue
          }
