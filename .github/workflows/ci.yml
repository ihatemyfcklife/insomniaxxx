name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify pinned modules
        run: |
          go mod download
          go mod verify

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build WebAssembly frontend
        run: |
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/app/static/wasm_exec.js
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o internal/app/static/app.wasm ./cmd/wasm
          test -s internal/app/static/app.wasm

      - name: Build Linux server binary
        env:
          VERSION: ${{ github.sha }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w -X anonblossom/internal/web.Version=$VERSION" -o dist/anonblossom ./cmd/anonblossom
          test -s dist/anonblossom

      - name: Build production container
        run: docker build --build-arg VERSION="${GITHUB_SHA}" --tag anonblossom:ci .
