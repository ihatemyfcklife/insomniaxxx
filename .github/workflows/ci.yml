name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
