name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting of changed Go files
        run: |
          files="$(git diff --name-only HEAD^1...HEAD -- '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(printf '%s\n' "$files" | xargs gofmt -l)"
            if [ -n "$unformatted" ]; then
              echo "These changed Go files need gofmt:"
              echo "$unformatted"
              exit 1
            fi
          fi
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
