name: Temporary production hardening format

on:
  push:
    branches: [hardening/production-readiness-20261010]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/production-readiness-20261010
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd internal
          git rm -f .github/workflows/production-hardening-gofmt.yml
          git add cmd internal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: gofmt production-readiness hardening [skip release]"
          git push origin HEAD:refs/heads/hardening/production-readiness-20261010
