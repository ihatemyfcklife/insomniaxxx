name: One-time formatting for scaling branch
on:
  push:
    branches: [perf/1000-transfer-foundations]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Format changed Go files
        run: |
          gofmt -w internal/app/app.go internal/app/server.go internal/app/handlers_download.go internal/app/transfer_admission_test.go internal/app/handlers_upload.go internal/app/handlers_upload_raw.go internal/blossom/client.go internal/blossom/stream.go internal/blossom/stream_test.go internal/config/config.go internal/config/scale_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/app internal/blossom internal/config
            git commit -m 'style: gofmt scaling change [skip release]'
            git push origin HEAD:perf/1000-transfer-foundations
          fi
