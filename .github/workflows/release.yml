name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto, major, minor, patch)"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # Pas de release pour les PRs du bot deps ni les commits [skip release]/[no-tag]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip release]') &&
       !contains(github.event.head_commit.message, '[no-tag]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Determine version bump
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          INPUT="${{ inputs.bump }}"
          if [ "$INPUT" != "" ] && [ "$INPUT" != "auto" ]; then
            echo "bump=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$MSG" | grep -qiE "BREAKING CHANGE|feat!:"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi
          echo "Commit: $MSG"

      - name: Compute next tag
        id: tag
        run: |
          git fetch --tags
          LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          [ -z "$LAST" ] && LAST="v0.0.0"
          echo "Last tag: $LAST"
          VER=${LAST#v}
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *) PATCH=$((PATCH+1)) ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Build static assets (pico + wasm)
        run: |
          mkdir -p internal/app/static
          [ -f internal/app/static/pico.min.css ] || curl -sSL -o internal/app/static/pico.min.css https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.fuchsia.min.css
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/app/static/wasm_exec.js 2>/dev/null || \
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" internal/app/static/wasm_exec.js
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o internal/app/static/app.wasm ./cmd/wasm

      - name: Build release binaries
        run: |
          mkdir -p dist
          TAG="${{ steps.tag.outputs.tag }}"
          LDFLAGS="-s -w -X anonblossom/internal/web.Version=$TAG"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/anonblossom-linux-amd64 ./cmd/anonblossom
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/anonblossom-linux-arm64 ./cmd/anonblossom
          cp internal/app/static/app.wasm dist/app.wasm
          cp internal/app/static/wasm_exec.js dist/wasm_exec.js
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/anonblossom-linux-amd64
            dist/anonblossom-linux-arm64
            dist/app.wasm
            dist/wasm_exec.js
            dist/SHA256SUMS.txt
