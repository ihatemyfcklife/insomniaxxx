name: go-deps-update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Update all Go modules
        run: |
          set -e
          GO_VER=$(go version | awk '{print $3}' | sed 's/go//')
          echo "Runner Go: $GO_VER"
          # Monte les deps en restant compatible avec le Go du runner
          go get -u -go="$GO_VER" ./... || go get -u ./...
          # Si des deps exigent un Go plus récent, go mod tidy mettra go.mod à jour ;
          # le runner étant déjà sur stable, le build suivra.
          go mod tidy
          go build ./...

      - name: Build + test check
        run: |
          go vet ./...
          go test ./...

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): auto-update go modules"
          branch: chore/go-deps-auto
          delete-branch: true
          title: "chore(deps): auto-update go modules"
          body: |
            Mise à jour automatique des dépendances Go (`go get -u ./...` + `go mod tidy`).
            Déclenché toutes les 6h par cron.
          labels: dependencies
