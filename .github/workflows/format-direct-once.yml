name: One-time gofmt of direct transport
on:
  push:
    branches: [perf/wasm-direct-blossom]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: gofmt direct browser transport
        run: |
          set -euo pipefail
          gofmt -w internal/app/handlers_direct.go internal/app/handlers_direct_test.go internal/blossom/direct.go internal/app/routes.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/app internal/blossom
            git commit -m 'style: gofmt direct Blossom endpoints [skip release]'
            git push origin HEAD:perf/wasm-direct-blossom
          fi
